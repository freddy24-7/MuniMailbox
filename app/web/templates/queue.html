{% extends "base.html" %}
{% block content %}
<h1>Queue</h1>
<p><form method="post" action="/intake/next"><button>Fetch next email from the feed</button></form></p>
<form method="get" action="/queue" class="block">
  <label>Topic
    <select name="topic">
      <option value="">All</option>
      {% for option in topics %}<option value="{{ option.value }}"{% if option == topic %} selected{% endif %}>{{ option.value.replace("_", " ") }}</option>{% endfor %}
    </select>
  </label>
  <label>Status
    <select name="status">
      <option value="">All</option>
      {% for option in statuses %}<option value="{{ option.value }}"{% if option == status %} selected{% endif %}>{{ option.value.replace("_", " ") }}</option>{% endfor %}
    </select>
  </label>
  <button class="plain">Filter</button>
</form>
<p class="muted">Most urgent first; within one urgency, the email that has waited longest.</p>
<table>
  <thead><tr><th>Received</th><th>Subject (redacted)</th><th>Topic</th><th>Urgency</th><th>Status</th><th></th></tr></thead>
  <tbody hx-get="/queue/rows?{{ filters }}" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "_queue_rows.html" %}
  </tbody>
</table>
{% endblock %}
