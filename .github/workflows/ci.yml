name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: munimailbox
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: munimailbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munimailbox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      # Throwaway database that exists only for this job.
      DATABASE_URL: postgresql+asyncpg://munimailbox:ci-only@localhost:5432/munimailbox
      TEST_DATABASE_URL: postgresql+asyncpg://munimailbox:ci-only@localhost:5432/munimailbox
      SPACY_MODEL: nl_core_news_lg
      # Tests use a fake model; nothing listens here.
      LOCAL_LLM_BASE_URL: http://llm.invalid/v1
      LOCAL_LLM_MODEL: not-a-real-model
      EMBEDDING_MODEL: not-a-real-embedding-model
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Generate throwaway keys for this job
        run: |
          for name in ENCRYPTION_KEY SESSION_SECRET; do
            echo "$name=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          done
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (with the coverage gate from the PRD)
        run: uv run pytest tests/unit tests/integration --cov=app --cov-fail-under=70
      - name: PII recall gate
        run: uv run pytest tests/pii_testset -s
      - name: Browser tests
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest tests/e2e

  deploy:
    # A push to main that passes the tests is deployed (PRD acceptance criterion).
    # Switched on by a repository variable, so a fork or a repo without a server skips it.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Run deploy.sh on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # The server's key is pinned: the job refuses to talk to an unknown host.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$TARGET" \
            "/opt/munimailbox/deploy/deploy.sh ${{ github.sha }}"
