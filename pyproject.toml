[project]
name = "munimailbox"
version = "0.1.0"
description = "Municipal Inbox Assistant: drafts replies to citizen emails for a fictional Dutch municipality"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "chromadb-client>=1.5.9",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "nl-core-news-lg",
    "presidio-analyzer>=2.2.364",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"scripts/generate_synthetic.py" = ["S311"]  # seeded random is intended: reproducible fake data

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
nl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "faker>=40.43.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
