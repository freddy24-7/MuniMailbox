# Local stack. Services are added stage by stage.
name: munimailbox

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is never exposed publicly (GR-11).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    # Same version as the chromadb-client package in pyproject.toml.
    image: chromadb/chroma:1.5.9
    ports:
      # Localhost only, like the database (GR-11). 8001 because the app uses 8000.
      - "127.0.0.1:${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/data

  redis:
    image: redis:8-alpine
    # Append-only file: the event stream survives a restart of the container. A small
    # memory cap is plenty: events hold identifiers only.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb"]
    ports:
      # Localhost only, like the database (GR-11).
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # --- Monitoring (NFR-1 to NFR-3). Not started by default: these four containers only
  # run with `docker compose --profile monitoring up -d`. Memory is capped per container.

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # So the container can reach the app on the host, also on Linux.
      - "host.docker.internal:host-gateway"
    mem_limit: 256m

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    mem_limit: 256m

  alloy:
    profiles: [monitoring]
    image: grafana/alloy:v1.7.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # The app writes logs/app.log when LOG_FILE is set.
      - ../logs:/var/log/munimailbox:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki]
    mem_limit: 192m

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Localhost only. Set GRAFANA_ADMIN_PASSWORD in .env before exposing it anywhere.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki]
    mem_limit: 256m

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  redis_data:
  postgres_data:
  chroma_data:
