# Retrieval test set: questions a citizen might ask, and the page(s) that answer them.
# Used by scripts/evaluate_retrieval.py to compare semantic, keyword and hybrid search.
#
# The questions are made up for this project and contain no personal data. They are
# written in everyday words on purpose ("grijze container", not "kliko"). The expected
# pages were chosen from the page titles and headings in data/sources.toml; a case counts
# as found when any passage from one of its expected pages is returned.

[[case]]
topic = "waste_collection"
question = "Afgelopen week is de grijze container bij ons niet geleegd. Wanneer wordt dit alsnog gedaan?"
expected = [
  "https://www.utrecht.nl/wonen-en-leven/afval/ophaaldag",
  "https://www.utrecht.nl/wonen-en-leven/afval/klikos",
]

